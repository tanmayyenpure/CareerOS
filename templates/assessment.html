<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerOS — Skill Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
<script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
<style>
  .quiz-wrap{max-width:640px;margin:6.5rem auto 4rem;padding:0 1rem}
  .quiz-progress-track{height:6px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:2rem}
  .quiz-progress-fill{height:100%;width:5%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal));transition:width .4s cubic-bezier(.16,1,.3,1)}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;color:var(--muted);margin-bottom:0.6rem}
  .quiz-card{
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;
    padding:2rem;min-height:280px;display:flex;flex-direction:column;
    animation:qfade .35s ease both;
  }
  @keyframes qfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .quiz-question{font-size:1.15rem;font-weight:600;margin-bottom:1.4rem;line-height:1.5}
  .quiz-options{display:flex;flex-direction:column;gap:0.7rem;flex:1}
  .quiz-option{
    display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1rem;border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);
    cursor:pointer;transition:border-color .2s ease,background .2s ease,transform .15s ease;
    font-size:0.94rem;
  }
  .quiz-option:hover{border-color:rgba(var(--color-primary-rgb),.33);transform:translateX(3px)}
  .quiz-option.selected{border-color:var(--purple);background:rgba(var(--color-primary-rgb),0.12)}
  .quiz-option .opt-letter{
    width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;
    color:var(--muted);flex-shrink:0;transition:background .2s ease,border-color .2s ease,color .2s ease;
  }
  .quiz-option.selected .opt-letter{background:var(--purple);border-color:var(--purple);color:#fff}
  .quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem}
  .quiz-btn{
    padding:0.65rem 1.4rem;border-radius:8px;font-size:0.88rem;font-weight:600;cursor:pointer;
    border:1px solid rgba(255,255,255,0.12);background:transparent;color:inherit;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s ease,opacity .2s ease;
  }
  .quiz-btn:hover{border-color:var(--purple)}
  .quiz-btn:active{transform:scale(.96)}
  .quiz-btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
  .quiz-btn-primary{background:linear-gradient(135deg,var(--purple),var(--teal));border:none;color:#fff}
  .quiz-btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(var(--color-primary-rgb),.35)}
  .quiz-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:1.6rem}
  .quiz-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.15);transition:background .2s ease,transform .2s ease}
  .quiz-dot.answered{background:var(--purple)}
  .quiz-dot.current{transform:scale(1.4)}
</style>
</head>

<body>
<canvas id="hero-canvas"></canvas>

<nav id="navbar">
<a href="{{ url_for('home') }}" class="nav-logo">CareerOS</a>
</nav>

<section class="quiz-wrap">
  <div class="fade-in" style="text-align:center;margin-bottom:1.6rem">
    <p class="section-label">{{ domain_label or "Skill Assessment" }}</p>
    <h2 class="section-title">Let's check where you're starting from</h2>
    <p class="section-sub">20 quick questions, about 15 minutes. This tunes your roadmap to your real skill level — no wrong answers hold you back, guessing just means a more foundational starting point.</p>
  </div>

  <div class="quiz-meta">
    <span id="q-counter">Question 1 of 20</span>
    <span id="q-answered-count">0 answered</span>
  </div>
  <div class="quiz-progress-track"><div class="quiz-progress-fill" id="progress-fill"></div></div>

  <form id="assessment-form" method="POST" action="{{ url_for('assessment_submit') }}">
    <input type="hidden" name="domain" value="{{ domain }}">
    <div id="answers-payload"></div>

    <div class="quiz-card" id="quiz-card">
      <!-- populated by JS -->
    </div>

    <div class="quiz-nav">
      <button type="button" class="quiz-btn" id="btn-prev">← Previous</button>
      <button type="button" class="quiz-btn quiz-btn-primary" id="btn-next">Next →</button>
      <button type="submit" class="quiz-btn quiz-btn-primary" id="btn-submit" style="display:none">Submit Assessment</button>
    </div>

    <div class="quiz-dots" id="quiz-dots"></div>
  </form>
</section>

<script>
// `questions` is rendered server-side as a JSON array of
// { id, text, options: [a, b, c, d] } — no correct_answer is ever sent to the client.
const QUESTIONS = {{ questions | tojson }};

let current = 0;
const answers = {}; // { questionId: selectedIndex }

const qCard = document.getElementById('quiz-card');
const qCounter = document.getElementById('q-counter');
const answeredCount = document.getElementById('q-answered-count');
const progressFill = document.getElementById('progress-fill');
const dotsWrap = document.getElementById('quiz-dots');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnSubmit = document.getElementById('btn-submit');
const payloadWrap = document.getElementById('answers-payload');

function renderDots(){
  dotsWrap.innerHTML = QUESTIONS.map((q, i) => {
    const cls = ['quiz-dot'];
    if(answers[q.id] !== undefined) cls.push('answered');
    if(i === current) cls.push('current');
    return `<span class="${cls.join(' ')}"></span>`;
  }).join('');
}

function renderQuestion(){
  const q = QUESTIONS[current];
  const letters = ['A','B','C','D'];
  qCard.innerHTML = `
    <div class="quiz-question">${escapeHtml(q.text)}</div>
    <div class="quiz-options">
      ${q.options.map((opt, i) => `
        <div class="quiz-option ${answers[q.id] === i ? 'selected' : ''}" data-index="${i}">
          <span class="opt-letter">${letters[i]}</span>
          <span>${escapeHtml(opt)}</span>
        </div>
      `).join('')}
    </div>
  `;
  qCard.querySelectorAll('.quiz-option').forEach(el => {
    el.addEventListener('click', () => {
      answers[q.id] = parseInt(el.dataset.index, 10);
      renderQuestion();
      renderDots();
      updateNav();
      syncPayload();
    });
  });

  qCounter.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  answeredCount.textContent = `${Object.keys(answers).length} answered`;
  progressFill.style.width = `${((current + 1) / QUESTIONS.length) * 100}%`;
}

function updateNav(){
  btnPrev.disabled = current === 0;
  const isLast = current === QUESTIONS.length - 1;
  btnNext.style.display = isLast ? 'none' : 'inline-block';
  btnSubmit.style.display = isLast ? 'inline-block' : 'none';
}

function syncPayload(){
  payloadWrap.innerHTML = Object.entries(answers)
    .map(([qid, idx]) => `<input type="hidden" name="answer_${qid}" value="${idx}">`)
    .join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

btnPrev.addEventListener('click', () => { current = Math.max(0, current - 1); renderQuestion(); renderDots(); updateNav(); });
btnNext.addEventListener('click', () => { current = Math.min(QUESTIONS.length - 1, current + 1); renderQuestion(); renderDots(); updateNav(); });

document.getElementById('assessment-form').addEventListener('submit', (e) => {
  if(Object.keys(answers).length < QUESTIONS.length){
    e.preventDefault();
    const unanswered = QUESTIONS.findIndex(q => answers[q.id] === undefined);
    current = unanswered;
    renderQuestion();
    renderDots();
    updateNav();
    qCard.style.boxShadow = '0 0 0 2px var(--coral)';
    setTimeout(() => qCard.style.boxShadow = '', 600);
  }
});

renderQuestion();
renderDots();
updateNav();
</script>
</body>
</html>
